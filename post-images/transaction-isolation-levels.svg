<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="70" y="88" fill="white" font-size="42" font-weight="700" font-family="sans-serif">事务隔离级别：一致性与并发度的取舍</text><g font-family="sans-serif"><text x="80" y="155" fill="#93c5fd" font-size="20">并发度更高</text><text x="1020" y="155" fill="#86efac" font-size="20">隔离性更强</text><path d="M120 180H1080" stroke="#64748b" stroke-width="8"/></g>
  <g font-family="sans-serif" text-anchor="middle"><g transform="translate(80 220)"><rect width="240" height="230" rx="24" fill="#1d4ed8"/><text x="120" y="58" fill="white" font-size="27" font-weight="700">读未提交</text><text x="120" y="110" fill="#dbeafe" font-size="20">可能：脏读</text><text x="120" y="145" fill="#dbeafe" font-size="20">不可重复读</text><text x="120" y="180" fill="#dbeafe" font-size="20">幻读</text></g><g transform="translate(350 220)"><rect width="240" height="230" rx="24" fill="#2563eb"/><text x="120" y="58" fill="white" font-size="27" font-weight="700">读已提交</text><text x="120" y="120" fill="#dbeafe" font-size="20">阻止脏读</text><text x="120" y="160" fill="#dbeafe" font-size="20">仍可能不可重复读</text></g><g transform="translate(620 220)"><rect width="240" height="230" rx="24" fill="#0f766e"/><text x="120" y="58" fill="white" font-size="27" font-weight="700">可重复读</text><text x="120" y="120" fill="#ccfbf1" font-size="20">稳定读取快照</text><text x="120" y="160" fill="#ccfbf1" font-size="20">具体行为看数据库实现</text></g><g transform="translate(890 220)"><rect width="240" height="230" rx="24" fill="#047857"/><text x="120" y="58" fill="white" font-size="27" font-weight="700">可串行化</text><text x="120" y="120" fill="#d1fae5" font-size="20">最强隔离</text><text x="120" y="160" fill="#d1fae5" font-size="20">并发与等待成本最高</text></g></g><text x="600" y="535" text-anchor="middle" fill="#cbd5e1" font-size="23" font-family="sans-serif">隔离级别越高，不代表业务一定正确；约束、锁和重试仍需共同设计</text></svg>
