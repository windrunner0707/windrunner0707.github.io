<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><defs><linearGradient id="bg" x2="1"><stop stop-color="#082f49"/><stop offset="1" stop-color="#0f172a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#38bdf8"/></marker></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="70" y="88" fill="white" font-size="42" font-weight="700" font-family="sans-serif">绞杀者迁移：用 Toggle 控制新旧链路</text><g font-family="sans-serif" text-anchor="middle" fill="white"><rect x="70" y="240" width="190" height="110" rx="24" fill="#0369a1"/><text x="165" y="305" font-size="28">商品服务</text><rect x="365" y="220" width="220" height="150" rx="24" fill="#7c3aed"/><text x="475" y="282" font-size="30">请求级 Toggle</text><text x="475" y="322" fill="#ede9fe" font-size="19">租户 / 用户 / 流量比例</text><rect x="730" y="130" width="380" height="130" rx="24" fill="#92400e"/><text x="920" y="190" font-size="28">旧链路：共享数据库</text><text x="920" y="226" fill="#fef3c7" font-size="19">逐步停止读取并撤销权限</text><rect x="730" y="370" width="380" height="130" rx="24" fill="#047857"/><text x="920" y="430" font-size="28">新链路：库存 HTTP API</text><text x="920" y="466" fill="#d1fae5" font-size="19">影子读 → 小流量 → 全量</text></g><g fill="none" stroke="#38bdf8" stroke-width="8" marker-end="url(#a)"><line x1="260" y1="295" x2="355" y2="295"/><path d="M585 270 C650 250 665 195 720 195"/><path d="M585 320 C650 340 665 435 720 435"/></g><text x="600" y="570" text-anchor="middle" fill="#bae6fd" font-size="23" font-family="sans-serif">迁移终点不是永久保留开关，而是删除旧 DAO、旧账号和双路代码</text></svg>
